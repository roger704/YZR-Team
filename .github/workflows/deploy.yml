name: Deploy Slidev deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment documentation before build
        working-directory: .
        run: python3 scripts/check-documentation.py

      - name: Verify deployment review client
        working-directory: .
        run: python3 -m unittest discover -s scripts -p test_deployment_review.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build deck
        run: npx slidev build --base /YZR-Team/ --out dist

      - name: SPA fallback (copy index.html → 404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed deployment source
        env:
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/check-deployment-review.py --github-oidc --repository "$DEPLOY_REPOSITORY" --sha "$DEPLOY_SHA" --require-check documentation
      - id: deployment
        uses: actions/deploy-pages@v4
