name: Deploy Slidev deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment documentation before build
        working-directory: .
        run: python3 scripts/check-documentation.py

      - name: Verify deployment review client
        working-directory: .
        run: python3 -m unittest discover -s scripts -p test_deployment_review.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build deck
        run: npx slidev build --base /YZR-Team/ --out dist

      - name: SPA fallback (copy index.html → 404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/dist

  deploy:
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed deployment source
        env:
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check-deployment-review.py
          test ! -L scripts/check-deployment-review.py
          printf '%s  %s\n' 'da49366637a05305cbff300e4643cd348f7fbc08bd93aa84c6c28da2f45b9b3b' 'scripts/check-deployment-review.py' | sha256sum --check --status
          python3 -I scripts/check-deployment-review.py --github-oidc --repository "$DEPLOY_REPOSITORY" --sha "$DEPLOY_SHA" --require-check documentation
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
